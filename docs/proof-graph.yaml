schema_version: 1
title: Navier–Stokes whole-space regularity architecture
terminal_claim: NS-R3
phase_i_status: not-started-awaiting-user
source_revision:
  manuscript_commit: d84950b50f068ec9d4c2dab44b994efa9e12dc3a
nodes:
  - id: LOCAL
    title: Local classical solution
    statement: Each divergence-free Schwartz datum on R3 and viscosity nu greater than zero has a unique maximal classical finite-energy solution on [0,Tstar).
    kind: imported
    depends_on: []
    mechanism: Sobolev local existence and uniqueness
    paper_label: 'premise:local'
    evidence: literature/foundations.md
    review: Tao Theorem 5.4 directly inspected for whole-space local mild existence and Schwartz-data smooth velocity and pressure through the initial time.
  - id: ENERGY
    title: Energy identity
    statement: On every compact classical interval, E(t) + 2 nu integral_0^t Y(s) ds = E(0), where E is squared L2 velocity and Y is squared L2 gradient.
    kind: paper
    depends_on: [LOCAL]
    mechanism: divergence cancellation and integration by parts
    paper_label: 'prop:energy'
    evidence: research/evidence/enstrophy.md
    review: Estimates audit at paper d3b60b7 passes this identity; see research/evidence/review-estimates.md.
  - id: SCALE
    title: Critical scaling
    statement: Velocity scaling lambda u(lambda x,lambda squared t) preserves L3; the energy estimates yield L4_t L3_x, which does not imply L-infinity_t L3_x.
    kind: paper
    depends_on: [ENERGY]
    mechanism: change of variables and Sobolev interpolation
    paper_label: 'prop:scaling'
    evidence: research/evidence/enstrophy.md
    review: Estimates audit at paper d3b60b7 passes scaling and interpolation; see research/evidence/review-estimates.md.
  - id: ENSTROPHY
    title: Enstrophy differential bound
    statement: On a classical interval, Y prime is at most C nu to the power minus three times Y cubed.
    kind: paper
    depends_on: [LOCAL]
    mechanism: stretching identity, Sobolev estimates, and Young inequality
    paper_label: 'prop:enstrophy'
    evidence: research/evidence/enstrophy.md
    review: Estimates audit passes; Sobolev cutoff wording repair applied to evidence. See research/evidence/review-estimates.md and review-frequency.md.
  - id: ODE
    title: Energy closure obstruction
    statement: A nonnegative scalar function can diverge at finite time while its time integral is finite and its derivative is bounded above by a constant times its cube.
    kind: paper
    depends_on: []
    mechanism: explicit inverse-square-root example
    paper_label: 'prop:ode'
    evidence: research/evidence/enstrophy.md
    review: Estimates audit passes the explicit scalar example. This is not a Navier–Stokes blowup solution.
  - id: CRITICAL
    title: A priori critical bound
    statement: For each viscosity, Schwartz datum, and finite T, there exists a finite M depending only on these inputs such that the maximal solution obeys sup over 0 <= t < min(T,Tstar) of its L3 norm <= M.
    kind: gap
    depends_on: [PRESSURE, ABSORPTION]
    mechanism: integrate the critical balance under the unproved absorption estimate
    paper_label: 'hyp:critical'
    evidence: research/evidence/architecture.md
    review: Open. Energy and scaling do not prove this assertion.
  - id: PRESSURE
    title: Critical pressure balance
    statement: One third of the derivative of the cubed L3 norm plus nu times the weighted cubic dissipation equals the signed pressure work integral p u dot gradient of absolute u.
    kind: paper
    depends_on: [LOCAL]
    mechanism: test the velocity equation against absolute u times u
    paper_label: 'prop:pressure'
    evidence: research/evidence/architecture.md
    review: Pressure audit passes the identity with explicit regularization details integrated in paper 3545e17; see research/evidence/review-pressure.md.
  - id: ABSORPTION
    title: Signed pressure absorption
    statement: For every datum, viscosity and finite horizon T there is a finite a priori A, and a fixed theta less than one, such that integrated signed pressure work up to every tau less than min(T,Tstar) is at most theta nu times integrated cubic dissipation plus A.
    kind: gap
    depends_on: [LOW-PRESSURE, HIGH-PRESSURE]
    mechanism: split pressure work into controlled low frequencies and an unproved high-frequency estimate
    paper_label: 'hyp:absorption'
    evidence: research/evidence/architecture.md
    review: Open. Strict absorption also controls weighted dissipation, but the ordinary existential finite-horizon assertion is not logically stronger than global strong continuation. See hf02-review-controller.md and hf03-review-paper.md. No energy-only producer.
  - id: LOW-PRESSURE
    title: Low-frequency pressure bound
    statement: At any fixed dyadic cutoff J, the accumulated low-frequency pressure work up to tau less than min(H,Tstar) is bounded in absolute value by C 2^(3J) times the fourth power of initial L2 velocity times the square root of H/(2 nu).
    kind: paper
    depends_on: [ENERGY]
    mechanism: bounded low-frequency Riesz kernel and Cauchy–Schwarz in time
    paper_label: 'prop:lowpressure'
    evidence: research/evidence/frequency.md
    review: Frequency audit passes the kernel and energy calculation; integrated in paper 3545e17. See research/evidence/review-frequency.md.
  - id: HIGH-PRESSURE
    title: Signed high-frequency control
    statement: There exists a fixed theta in [0,1) such that for every datum, viscosity and positive finite horizon H there exist an integer cutoff J and a finite nonnegative remainder making accumulated high-frequency pressure work at most theta nu times accumulated cubic dissipation plus that remainder, for every tau less than min(H,Tstar).
    kind: gap
    depends_on: []
    mechanism: new signed time-integrated pressure estimate on actual trajectories
    paper_label: 'hyp:highpressure'
    evidence: research/evidence/frequency.md
    review: Open. The existential assertion is equivalent to global continuation of the selected strong branch. A compact R3 profile with positive pressure work now has an audited construction; this rules out a universal sign argument, not spacetime HF. See hf02-r3-profile.md and hf02-review-profile.md. The corrected heat defect retains the same gap. The square-energy second variation and compact-interval aggregate limit are audited in hf08-review-second-variation.md and hf09-review-square-limit.md. The periodic bounded-carrier diagnostic (hf09-review-bounded-carrier.md) excludes only an instantaneous frequency-separation gain; no spacetime producer is proved. The full-pressure homogeneous correction family fails universal heat monotonicity for every parameter; hf13-homogeneous-heat-obstruction.md integrates the audited sign and packet arguments. This is not an obstruction to the fixed high-output estimate.
  - id: ESS
    title: Endpoint continuation
    statement: A maximal smooth finite-energy R3 solution with finite maximal time has unbounded L3 norm on that interval; a finite uniform L3 bound excludes finite-time breakdown.
    kind: imported
    depends_on: []
    mechanism: endpoint regularity and continuation
    paper_label: 'thm:continuation'
    evidence: literature/critical-criteria.md
    review: Published endpoint theorem; exact source scope recorded in literature dossier.
  - id: CONDITIONAL
    title: Conditional global theorem
    statement: Assuming the CRITICAL estimate for every admissible input, LOCAL and ESS give infinite lifespan and ENERGY gives the Clay finite-energy bound.
    kind: conditional
    depends_on: [ENERGY, CRITICAL, ESS]
    mechanism: contradiction at a finite maximal time
    paper_label: 'thm:conditional'
    evidence: research/evidence/architecture.md
    review: Integration audit validates the conditional mathematics; its quantifier and label repairs are applied in paper d7563ef. See research/evidence/review-integration.md. CRITICAL remains unproved.
  - id: NS-R3
    title: Clay alternative A
    statement: Every smooth divergence-free rapidly decreasing initial velocity on R3 has a global smooth unforced Navier–Stokes velocity and pressure of uniformly bounded kinetic energy, for every positive viscosity.
    kind: gap
    depends_on: [CONDITIONAL, CRITICAL]
    mechanism: discharge the critical estimate in the conditional theorem
    paper_label: 'def:target'
    evidence: docs/proof.md
    review: Open. No complete proof or counterexample.
