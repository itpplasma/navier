    kind: paper
    status: author-checked-independent-audit-pending
    statement: All real trajectories of the coupled block are global with E=x^2+4y^2+3z^2 and E prime <= -2E.
    depends_on: [CF-BLOCK]
    evidence: research/evidence/2026-09-07-closed-feedback-and-causal-radius.md
    section: '2'
    scope: Real finite-dimensional dynamics; no complex positive-energy bound.
  - id: CF-LOCAL-SERIES
    kind: paper
    status: author-checked-independent-audit-pending
