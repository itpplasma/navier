- id: ENTIRE-ZERO-CENTER-CAUSAL
  status: refuted-in-specified-full-Galerkin-family
  reopening: restart or use a justified summation not requiring this globally convergent amplitude series
- id: POLYNOMIAL-METRIC-CONDITION
