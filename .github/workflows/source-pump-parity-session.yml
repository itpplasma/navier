name: Source-pump parity integration
on:
  push:
    branches: [research/navier-source-pump-parity-20260912]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_source_pump_half_grade_parity.py /tmp/check_source_pump_half_grade_parity.py
          cp research/evidence/2026-09-12-source-pump-half-grade-parity.md /tmp/source-pump-half-grade-parity.md
          cp tools/integrate_source_pump_half_grade_parity_20260912.py /tmp/integrate_source_pump_half_grade_parity.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_source_pump_half_grade_parity.py research/check_source_pump_half_grade_parity.py
          cp /tmp/source-pump-half-grade-parity.md research/evidence/2026-09-12-source-pump-half-grade-parity.md
          python3 /tmp/integrate_source_pump_half_grade_parity.py
      - name: Verify checkpoint
        run: |
          python3 -m pip install sympy
          python3 research/check_source_pump_half_grade_parity.py
          python3 research/game/run.py fast
          python3 research/game/run.py full
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json research/check_source_pump_half_grade_parity.py research/evidence/2026-09-12-source-pump-half-grade-parity.md
          git commit -m 'Close zero-seed source-pump half-grade generation'
          git push origin HEAD:main
