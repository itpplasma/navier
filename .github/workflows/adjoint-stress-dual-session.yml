name: Adjoint principal stress-dual integration
on:
  push:
    branches: [research/navier-adjoint-stress-dual-20260912]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_adjoint_principal_stress_dual.py /tmp/check_adjoint_principal_stress_dual.py
          cp research/evidence/2026-09-12-adjoint-principal-stress-dual.md /tmp/adjoint-principal-stress-dual.md
          cp tools/integrate_adjoint_principal_stress_dual_20260912.py /tmp/integrate_adjoint_stress_dual.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_adjoint_principal_stress_dual.py research/check_adjoint_principal_stress_dual.py
          cp /tmp/adjoint-principal-stress-dual.md research/evidence/2026-09-12-adjoint-principal-stress-dual.md
          python3 /tmp/integrate_adjoint_stress_dual.py
      - name: Verify checkpoint
        run: |
          python3 research/check_adjoint_principal_stress_dual.py
          python3 research/game/run.py fast
          python3 research/game/selftest.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md research/check_adjoint_principal_stress_dual.py research/evidence/2026-09-12-adjoint-principal-stress-dual.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json
          git commit -m 'Close principal-carrier adjoint shortcut'
          git push origin HEAD:main
