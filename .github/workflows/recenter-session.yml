name: Recenter cage integration
on:
  push:
    branches: [research/navier-recenter-wall-20260912]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_recenter_cage_wall.py /tmp/check_recenter_cage_wall.py
          cp research/evidence/2026-09-12-recenter-cage-wall.md /tmp/recenter-cage-wall.md
          cp tools/integrate_recenter_cage_wall_20260912.py /tmp/integrate_recenter.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_recenter_cage_wall.py research/check_recenter_cage_wall.py
          cp /tmp/recenter-cage-wall.md research/evidence/2026-09-12-recenter-cage-wall.md
          python3 /tmp/integrate_recenter.py
      - name: Verify checkpoint
        run: |
          python3 -m pip install sympy
          python3 research/check_recenter_cage_wall.py
          python3 research/game/run.py fast
          python3 research/game/selftest.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md research/check_recenter_cage_wall.py research/evidence/2026-09-12-recenter-cage-wall.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json
          git commit -m 'Close z1 recentered parent-cage adapter'
          git push origin HEAD:main
