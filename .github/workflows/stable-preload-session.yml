name: Stable preload integration
on:
  push:
    branches: [research/navier-stable-preload-20260912]
permissions:
  contents: write
concurrency:
  group: navier-stable-preload-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_stable_preload_balance.py /tmp/check_stable_preload_balance.py
          cp research/evidence/2026-09-12-stable-preload-balance.md /tmp/stable-preload-evidence.md
          cp tools/integrate_stable_preload_balance_20260912.py /tmp/integrate_stable_preload.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_stable_preload_balance.py research/check_stable_preload_balance.py
          cp /tmp/stable-preload-evidence.md research/evidence/2026-09-12-stable-preload-balance.md
          python3 /tmp/integrate_stable_preload.py
      - name: Verify checkpoint
        run: |
          python3 -m pip install sympy PyYAML
          python3 research/check_stable_preload_balance.py
          python3 research/game/run.py fast
          python3 research/game/selftest.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git add -- PLAN.md research/check_stable_preload_balance.py research/evidence/2026-09-12-stable-preload-balance.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'Balance local relay with stable counterterms'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
