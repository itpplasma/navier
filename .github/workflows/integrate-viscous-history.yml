name: Integrate the authorized viscous-history manuscript changes
on:
  push:
    branches: [main]
    paths: ['tools/integrate_viscous_history_20260909.py']
permissions:
  contents: write
concurrency:
  group: navier-viscous-history-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 2
      - name: Install the existing manuscript dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern python3-yaml
      - name: Refresh and apply only the fingerprinted literal changes
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          python3 tools/integrate_viscous_history_20260909.py
      - name: Verify the complete checkout and build the manuscript
        run: |
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          make -C paper documents check
          git diff --exit-code -- docs/proof_map.tex paper/proof_map.tex
          git diff --check
          if grep -E 'There were undefined references|Citation .* undefined|Reference .* undefined|Overfull' paper/main.log; then exit 1; fi
      - name: Ordinary fast-forward push of the exact authorized patch
        run: |
          git add -- PLAN.md paper/Makefile paper/main.tex paper/references.bib
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'Integrate fixed-viscosity provenance into the live manuscript and PLAN'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
      - name: Save the built manuscript and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viscous-history-manuscript
          path: |
            paper/main.pdf
            paper/main.log
