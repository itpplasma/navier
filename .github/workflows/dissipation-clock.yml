name: Build papers and verify proof map
on:
  push:
    branches: [main]
    paths: ['paper/**', 'docs/proof-graph.yaml', 'docs/proof_map.tex', 'tools/generate_map.py', 'research/verify.py', 'PLAN.md', '.github/workflows/dissipation-clock.yml']
  pull_request:
    paths: ['paper/**', 'docs/proof-graph.yaml', 'docs/proof_map.tex', 'tools/generate_map.py', 'research/verify.py', 'PLAN.md', '.github/workflows/dissipation-clock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern python3-yaml
      - name: Check manuscript and graph
        run: |
          python3 research/verify.py --paper-only
          make -C paper documents check
          git diff --exit-code -- docs/proof_map.tex paper/proof_map.tex
          git diff --check
          if grep -E 'There were undefined references|Citation .* undefined|Reference .* undefined|Overfull' paper/main.log paper/proof_map.log paper/dissipation_clock.log paper/dissipation_budget_continuation.log paper/structural-obstructions/main.log; then exit 1; fi
      - name: Upload paper PDFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: navier-papers
          path: |
            paper/main.pdf
            paper/proof_map.pdf
            paper/dissipation_clock.pdf
            paper/dissipation_budget_continuation.pdf
            paper/structural-obstructions/main.pdf
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-build-logs
          path: paper/**/*.log
