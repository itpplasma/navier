name: Integrate dissipation-clock research checkpoint
on:
  push:
    branches: [main]
    paths:
      - 'research/evidence/2026-09-06-dissipation-clock.md'
      - 'tools/integrate_dissipation_clock.py'
      - 'research/verify.py'
      - '.github/workflows/dissipation-clock.yml'
permissions:
  contents: write
concurrency:
  group: dissipation-clock-research-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'itpplasma/navier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Install existing graph dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Refresh and integrate without promoting claims
        run: |
          git pull --ff-only origin main
          python3 tools/integrate_dissipation_clock.py
          python3 research/verify.py --research-only
          python3 tools/generate_map.py
          git diff --check
      - name: Commit explicit status and source paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md AGENTS.md README.md docs/proof.md docs/proof-graph.yaml docs/proof_map.tex tools/generate_map.py
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m 'Update live paper plan and main proof dossier with pending dissipation-clock component'
            git pull --rebase origin main
            python3 tools/integrate_dissipation_clock.py --check
            python3 research/verify.py --research-only
            python3 tools/generate_map.py
            git diff --exit-code -- docs/proof_map.tex
            git push origin HEAD:main
          fi
          git rev-parse HEAD > verified-source-commit.txt
          git archive --format=tar.gz -o verified-sources.tar.gz HEAD
      - name: Retain private source and graph evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dissipation-clock-research
          retention-days: 3
          path: |
            docs/proof_map.tex
            verified-source-commit.txt
            verified-sources.tar.gz
