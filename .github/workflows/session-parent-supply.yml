name: Parent-supply session verification
on:
  push:
    branches: [research/session-parent-supply-20260911]
    paths: ['.github/workflows/session-parent-supply.yml']
permissions:
  contents: write
concurrency:
  group: navier-parent-supply-session-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check exact patch and refresh main
        run: |
          cp research/session-parent-supply.patch /tmp/checkpoint.patch
          echo 'a5434d99e8294c74eaca7f6d1586a72cfbce2f831c74ec176fb0113f28875475  /tmp/checkpoint.patch' | sha256sum -c -
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
          git apply --check /tmp/checkpoint.patch
          git apply /tmp/checkpoint.patch
      - name: Replay exact and structural checks
        run: |
          python3 -m pip install PyYAML sympy
          python3 research/game/run.py fast
          python3 research/game/selftest.py
          python3 research/check_exterior_pressure_transmission.py
          python3 research/check_source_exterior_characteristic_wall.py
          python3 research/check_angular_heat_import.py
          python3 research/check_source_harmonic_protection.py
          python3 research/check_source_pulse_adjoint.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit only authorized paths and push without force
        run: |
          git add -- PLAN.md research/check_angular_heat_import.py research/check_exterior_pressure_transmission.py research/check_source_exterior_characteristic_wall.py research/evidence/2026-09-11-exterior-pressure-transmission.md research/evidence/2026-09-11-source-exterior-characteristic-wall.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit -m 'Prove angular exterior-pressure barrier and narrow parent-supply frontier'
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          git rev-parse HEAD
          echo "Integrated commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
