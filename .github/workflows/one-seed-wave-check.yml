name: One-seed wave checks
on:
  push:
    branches: [research/one-seed-wave-20260912]
    paths: ['.github/workflows/one-seed-wave-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Direct current-contract checks
        run: |
          python3 -m pip install sympy PyYAML
          python3 research/check_source_pump_half_grade_parity.py
          python3 research/check_half_grade_finite_time_bridge.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Export tracked public source only
        run: |
          git archive HEAD > /tmp/navier-source.tar
          git rev-parse HEAD > /tmp/navier-source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-seed-source
          retention-days: 1
          path: |
            /tmp/navier-source.tar
            /tmp/navier-source-commit.txt
