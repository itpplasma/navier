name: Full pump-chain wave integration
on:
  push:
    branches: [research/one-seed-wave-20260912]
    paths: ['.github/workflows/one-seed-wave-check.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preserve exact research wave
        run: |
          cp research/check_full_pump_chain.py /tmp/check_full_pump_chain.py
          cp research/evidence/2026-09-12-full-pump-chain-gain.md /tmp/full-pump-chain-gain.md
      - name: Refresh authoritative main
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 -m pip install numpy scipy sympy PyYAML
          python3 research/check_one_seed_ladder.py
          python3 research/verify.py --research-only
      - name: Apply research wave
        run: |
          test ! -e research/check_full_pump_chain.py
          cp /tmp/check_full_pump_chain.py research/check_full_pump_chain.py
          cp /tmp/full-pump-chain-gain.md research/evidence/2026-09-12-full-pump-chain-gain.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('PLAN.md');s=p.read_text()
          assert 'source_full_pump_chain_gain:' not in s
          s=s.replace('source_one_seed_ladder: exact-shortest-time-birth-survives-but-small-seed-free-bridge-composition-fails','source_one_seed_ladder: exact-shortest-time-birth-survives-but-small-seed-free-bridge-composition-fails\nsource_full_pump_chain_gain: infinite-tail-certified-charge-nine-extra-growth-and-decaying-pump-finite-time-gain')
          a=s.index('The next distinct attack is the **full pump-coupled linear chain**');b=s.index('\n## 9. UE2--UE4 after UE1',a)
          s=s[:a]+'''The full pump-coupled chain resolves that spectral question positively. An
          exact-rational residual/Jacobian certificate with the entire infinite tail
          retained gives, at charge nine and pump amplitude 30, an eigenvalue in the
          radius-`1e-6` disk about `5.049883304450+6.708966735593i`. Both transverse
          polarizations and every axial sideband are included. A Duhamel estimate then
          transfers this to the *freely decaying* reference pump: suitable real linearized
          data gain more than `51/50` in physical velocity L2 at time `1/200`. Thus the
          projected negative pair products did not imply full-chain stability. See
          `research/evidence/2026-09-12-full-pump-chain-gain.md`.

          The same wave supplies the limiting budget. With
          `c0=401/(200 sqrt(2))` and `kappa=20/sqrt(401)+1203/2000`, every charge obeys
          `||v(T)||/||v(0)|| <= exp[T+c0 |B0|(1-exp(-kappa T))/kappa]` along the decaying
          pump. Fixed pump amplitude gives only a fixed extra factor; an extra linear
          `exp(eta L)` factor requires at least `|B0|>=eta kappa L/c0`. Charge separation
          still prevents this linear mechanism from manufacturing the ninth-order
          ancestor from a zero charge-nine input.

          The active gap is now **source-specific pump action and nonlinear saturation
          with one inherited trace**, not another projected symbol or finite-section
          spectrum. Determine whether the needed growing pump-action regime is physically
          available with a controlled full correction, or switch to the localized
          full-history adjoint. The finite-time reference gain is not a completed
          regenerative turnover. UE1 and NS-R3 remain open.
          '''+s[b:]
          p.write_text(s)
          PY
      - name: Exact certificate and structural checks
        run: |
          python3 research/check_full_pump_chain.py
          python3 research/check_one_seed_ladder.py
          python3 research/check_source_pump_half_grade_parity.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git add PLAN.md research/check_full_pump_chain.py research/evidence/2026-09-12-full-pump-chain-gain.md
          git diff --cached --check
          git diff --cached --stat
      - name: Coherent commit and ordinary push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Certify full pump-chain growth and decaying-pump finite-time gain'
          git push origin HEAD:main
          git rev-parse HEAD
