name: Collar ancestry integration
on:
  push:
    branches: [research/navier-collar-ancestry-20260912]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_collar_angular_ancestry.py /tmp/check_collar_angular_ancestry.py
          cp research/evidence/2026-09-12-collar-angular-ancestry.md /tmp/collar-angular-ancestry.md
          cp tools/integrate_collar_angular_ancestry_20260912.py /tmp/integrate_collar_ancestry.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_collar_angular_ancestry.py research/check_collar_angular_ancestry.py
          cp /tmp/collar-angular-ancestry.md research/evidence/2026-09-12-collar-angular-ancestry.md
          python3 /tmp/integrate_collar_ancestry.py
      - name: Verify checkpoint
        run: |
          python3 research/check_collar_angular_ancestry.py
          python3 research/game/run.py fast
          python3 research/game/selftest.py
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md research/check_collar_angular_ancestry.py research/evidence/2026-09-12-collar-angular-ancestry.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json
          git commit -m 'Relocate collar pressure to angular ancestry'
          git push origin HEAD:main
