name: Grade-changing frontier integration
on:
  push:
    branches: [research/navier-grade-change-20260912b]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze authorized checkpoint
        run: |
          cp research/check_half_grade_parent_carry.py /tmp/check_half_grade_parent_carry.py
          cp research/evidence/2026-09-12-half-grade-parent-carry-wall.md /tmp/half-grade-parent-carry.md
          cp tools/integrate_half_grade_parent_carry_20260912.py /tmp/integrate_half_grade_parent_carry.py
      - name: Refresh main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Apply exact checkpoint
        run: |
          cp /tmp/check_half_grade_parent_carry.py research/check_half_grade_parent_carry.py
          cp /tmp/half-grade-parent-carry.md research/evidence/2026-09-12-half-grade-parent-carry-wall.md
          python3 /tmp/integrate_half_grade_parent_carry.py
      - name: Verify checkpoint
        run: |
          python3 -m pip install sympy
          python3 research/check_half_grade_parent_carry.py
          python3 research/game/run.py fast
          python3 research/game/run.py full
          python3 research/verify.py --research-only
          python3 research/verify.py --paper-only
          git diff --check
      - name: Commit and push without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PLAN.md research/game/controls.json research/game/models/baseline.py research/game/snapshot.json research/check_half_grade_parent_carry.py research/evidence/2026-09-12-half-grade-parent-carry-wall.md
          git commit -m 'Close passive half-grade parent reuse'
          git push origin HEAD:main
