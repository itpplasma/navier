name: Frontier phase discriminator
on:
  push:
    branches: [research/navier-frontier-20260912]
permissions:
  contents: read
concurrency:
  group: navier-frontier-session-discriminator
  cancel-in-progress: true
jobs:
  discriminate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Freeze exact phase discriminator
        run: cp research/check_phase_graded_factor_two.py /tmp/check_phase_graded_factor_two.py
      - name: Refresh authoritative main and run fast gate first
        run: |
          git fetch origin main
          git checkout -B checked-main origin/main
          python3 research/game/run.py fast
      - name: Test the new phase-grade invariant
        run: python3 /tmp/check_phase_graded_factor_two.py
      - name: Structural verification
        run: |
          python3 research/verify.py --research-only
          git diff --check
